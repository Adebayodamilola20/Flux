name: ai_usage_monitor
description: "Flux — a minimal macOS menu-bar utility that reports AI tool usage."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  http: ^1.2.2
  intl: ^0.19.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/screenshots/
    # Only the size the UI draws; the 1024 master stays out of the bundle.
    - assets/brand/devnotch-mark-512.png
